name: Release Creation

on: 
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so GITHUB_TOKEN can upload assets to the release below, even if
    # this repo/org has default workflow permissions set to read-only.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 20

    - name: Extract Version From Tag
      id: get_version
      uses: battila7/get-version-action@v2

    - name: Install dependencies
      run: npm ci

    # Substitute the Manifest and Download URLs in module.json *before*
    # building packs below, so any "{{MODULE_VERSION}}" placeholder inside
    # macro/journal text (see scripts/packs.mjs) picks up the real version
    # too, not the literal "#{VERSION}#" token.
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: 'module.json'
      env:
        version: ${{github.event.release.tag_name}}
        url: https://github.com/${{github.repository}}
        manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
        download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip

    # Compiles packs/_source/*.json (plaintext, committed to git) into the
    # LevelDB packs/<name> directories Foundry actually loads. Those
    # compiled directories are gitignored, so this step must run before
    # zipping the release.
    - name: Build Packs
      run: npm run pack

    # Create a zip file with all files required by the module to add to the release.
    # packs/_source is JSON dev source, not needed at runtime, so it's excluded.
    - run: zip -r ./module.zip module.json LICENSE styles/ scripts/ languages/ packs/ images/ -x "packs/_source/*" "images/Hero339/**"

    # Create a release for this specific version
    - name: Update Release with Files
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true # Set this to false if you want to prevent updating existing releases
        name: ${{ github.event.release.name }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip'
        tag: ${{ github.event.release.tag_name }}
        body: ${{ github.event.release.body }}
    # POST to the package admin release endpoint
    - name: Publish Module to FoundryVTT Website
      id: publish-to-foundry-website
      uses: cs96and/FoundryVTT-release-package@v1
      with:
        package-token: ${{ secrets.PACKAGE_TOKEN }}
        manifest-url: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.json
